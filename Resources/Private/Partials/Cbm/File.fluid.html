<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
    <f:comment>{multiple} is 0 for relationship oneToOne, which holds a single file.</f:comment>
    <div>
        <f:render partial="Cbm/Helper/Label" arguments="{label: label}" />
        <f:if condition="{multiple}">
            <f:then>
                <f:for each="{record.{field}}" as="file">
                    <f:image image="{file}" />
                </f:for>
            </f:then>
            <f:else>
                <f:if condition="{record.{field}}">
                    <f:image image="{record.{field}}" />
                </f:if>
            </f:else>
        </f:if>
    </div>
</html>
