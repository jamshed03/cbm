<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">
    <f:layout name="Module" />

    <f:section name="Content">
        <h1><f:translate key="LLL:EXT:cbm/Resources/Private/Language/module.xlf:overview.heading" /></h1>
        <f:if condition="{isDevelopment}">
            <p>
                <a class="btn btn-primary" href="{f:be.uri(route: 'content_cbm.create')}">
                    <core:icon identifier="actions-plus" />
                    <f:translate key="LLL:EXT:cbm/Resources/Private/Language/module.xlf:action.create" />
                </a>
            </p>
        </f:if>
        <f:if condition="!{isDevelopment}">
            <f:be.infobox state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::INFO')}">
                <p><f:translate key="LLL:EXT:cbm/Resources/Private/Language/module.xlf:overview.readOnly" /></p>
            </f:be.infobox>
        </f:if>
        <f:for each="{groups}" as="group">
            <h2>EXT:{group.extension}</h2>
            <f:if condition="{isDevelopment} && !{group.writable}">
                <p class="text-body-secondary"><f:translate key="LLL:EXT:cbm/Resources/Private/Language/module.xlf:overview.vendor" /></p>
            </f:if>
            <div class="table-fit">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th><f:translate key="LLL:EXT:cbm/Resources/Private/Language/module.xlf:column.name" /></th>
                            <th><f:translate key="LLL:EXT:cbm/Resources/Private/Language/module.xlf:column.type" /></th>
                            <th><f:translate key="LLL:EXT:cbm/Resources/Private/Language/module.xlf:column.labels" /></th>
                            <th><f:translate key="LLL:EXT:cbm/Resources/Private/Language/module.xlf:column.preview" /></th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{group.contentBlocks}" as="contentBlock">
                            <tr>
                                <td>{contentBlock.name}</td>
                                <td>{contentBlock.type}</td>
                                <td>
                                    <f:if condition="{contentBlock.keysMissingInXlf}">
                                        <f:then>
                                            <span class="badge badge-warning"><f:translate key="LLL:EXT:cbm/Resources/Private/Language/module.xlf:labels.missing" arguments="{0: contentBlock.keysMissingInXlf}" /></span>
                                        </f:then>
                                        <f:else>
                                            <span class="badge badge-success"><f:translate key="LLL:EXT:cbm/Resources/Private/Language/module.xlf:labels.migrated" /></span>
                                        </f:else>
                                    </f:if>
                                </td>
                                <td><f:translate key="LLL:EXT:cbm/Resources/Private/Language/module.xlf:status.{contentBlock.previewStatus}" /></td>
                                <td class="col-control">
                                    <div class="btn-group">
                                        <a class="btn btn-default btn-sm" href="{f:be.uri(route: 'content_cbm.labels', parameters: {contentBlock: contentBlock.name})}">
                                            <core:icon identifier="actions-translate" />
                                            <f:translate key="LLL:EXT:cbm/Resources/Private/Language/module.xlf:action.labels" />
                                        </a>
                                        <f:if condition="{contentBlock.previewStatus} != 'unsupported'">
                                            <a class="btn btn-default btn-sm" href="{f:be.uri(route: 'content_cbm.preview', parameters: {contentBlock: contentBlock.name})}">
                                                <core:icon identifier="actions-eye" />
                                                <f:translate key="LLL:EXT:cbm/Resources/Private/Language/module.xlf:action.preview" />
                                            </a>
                                        </f:if>
                                    </div>
                                </td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
        </f:for>
    </f:section>
</html>
